[project]
name = "xbt-terminal"
version = "0.1.0"
description = "Terminal TUI para operar manualmente BTCB2 en NonKYC y Neoxa"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "textual-plotext>=1.0",
    "plotext>=5.3",
    "httpx>=0.27",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "segno>=1.6.6",
    "rich>=13.0",
]

[project.scripts]
xbt = "xbt_terminal.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xbt_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["spec(*ids): requerimientos (RF/RNF/CA) que verifica el test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "C90", "N"]
allowed-confusables = ["×"]  # se usa a propósito en fórmulas de docstrings

[tool.ruff.lint.mccabe]
max-complexity = 12  # D-77: el bot (`decide`, `search`) está en 12
